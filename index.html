<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Storage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  font-family: 'Courier New', monospace;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
#terminal {
  width: 95%;
  max-width: 900px;
  height: 85vh;
  background: #0d0d0d;
  border: 1px solid #1a1a2e;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#terminal-header {
  background: #111;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid #1a1a2e;
}
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.red { background: #ff5f57; }
.dot.yellow { background: #ffbd2e; }
.dot.green { background: #28ca42; }
#terminal-header span { margin-left: auto; color: #555; font-size: 12px; }
#output {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  color: #00ff88;
  font-size: 14px;
  line-height: 1.6;
}
#output .line { white-space: pre-wrap; word-break: break-all; }
#output .line.error { color: #ff5555; }
#output .line.info { color: #5f87ff; }
#output .line.success { color: #50fa7b; }
#input-line {
  display: flex;
  padding: 8px 12px;
  border-top: 1px solid #1a1a2e;
  background: #0d0d0d;
}
#prompt { color: #00ff88; margin-right: 6px; white-space: nowrap; }
#cmd-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #e0e0e0;
  font-family: 'Courier New', monospace;
  font-size: 14px;
}
#output::-webkit-scrollbar { width: 4px; }
#output::-webkit-scrollbar-track { background: #0d0d0d; }
#output::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
</style>
</head>
<body>
<div id="terminal">
  <div id="terminal-header">
    <div class="dot red"></div>
    <div class="dot yellow"></div>
    <div class="dot green"></div>
    <span>bash — 80×24</span>
  </div>
  <div id="output">
    <div class="line info">终端加载中...</div>
  </div>
  <div id="input-line">
    <span id="prompt">user@site:~$ </span>
    <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
  </div>
</div>

<script>
const SUPABASE_URL = 'https://uckpwvrxopgqwycjvdgc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dTnGa3HTbJK8ySV70Ij13A_nDWTlBdp';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const output = document.getElementById('output');
const input = document.getElementById('cmd-input');

function printLine(text, type = '') {
  const div = document.createElement('div');
  div.className = `line ${type}`;
  div.textContent = text;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

// ===== 自动记录访问 =====
async function logVisit() {
  try {
    const visitData = {
      key: `visit_${Date.now()}`,
      value: JSON.stringify({
        time: new Date().toLocaleString('zh-CN'),
        ua: navigator.userAgent.slice(0, 100),
        url: window.location.href,
        screen: `${screen.width}x${screen.height}`,
        lang: navigator.language
      })
    };

    const { error } = await supabase
      .from('terminal_data')
      .insert([visitData]);

    if (error) {
      printLine('[系统] 访问记录失败: ' + error.message, 'error');
      console.error('Visit log error:', error);
    } else {
      printLine(`[系统] ✓ 访问已记录 (${new Date().toLocaleTimeString('zh-CN')})`, 'success');
    }
  } catch (e) {
    printLine('[系统] 访问记录异常: ' + e.message, 'error');
    console.error(e);
  }
}

// ===== 页面加载时自动记录 =====
window.addEventListener('load', async () => {
  output.innerHTML = '';
  printLine('欢迎使用 Terminal Storage v0.3', 'info');
  printLine('正在记录访问信息...', 'info');
  await logVisit();
  printLine('输入 help 查看命令', 'info');
  printLine('', '');
});

// ===== 命令 =====
const commands = {
  help() {
    printLine('可用命令:', 'info');
    printLine('  help     - 帮助');
    printLine('  save     - 保存 (save key value)');
    printLine('  get      - 读取 (get key)');
    printLine('  ls       - 列出数据');
    printLine('  visits   - 查看访问记录');
    printLine('  clear    - 清屏');
  },
  clear() { output.innerHTML = ''; },
  async save(args) {
    if (args.length < 2) return printLine('用法: save <key> <value>', 'error');
    const key = args[0];
    const value = args.slice(1).join(' ');
    try {
      const { error } = await supabase.from('terminal_data').insert([{ key, value }]);
      if (error) throw error;
      printLine(`✓ 已保存 "${key}" = "${value}"`, 'success');
    } catch (e) {
      printLine('保存失败: ' + e.message, 'error');
    }
  },
  async get(args) {
    if (args.length < 1) return printLine('用法: get <key>', 'error');
    try {
      const { data, error } = await supabase.from('terminal_data').select('*').eq('key', args[0]).order('created_at', { ascending: false }).limit(1).maybeSingle();
      if (error) throw error;
      if (!data) return printLine(`未找到 "${args[0]}"`, 'error');
      printLine(`"${args[0]}" = "${data.value}"`, 'success');
    } catch (e) {
      printLine('读取失败: ' + e.message, 'error');
    }
  },
  async ls() {
    try {
      const { data, error } = await supabase.from('terminal_data').select('*').not('key', 'like', 'visit_%').order('created_at', { ascending: false }).limit(20);
      if (error) throw error;
      if (!data || data.length === 0) return printLine('(空)', 'info');
      data.forEach(r => printLine(`${r.key} = ${r.value}`, 'success'));
    } catch (e) {
      printLine('列表失败: ' + e.message, 'error');
    }
  },
  async visits() {
    try {
      const { data, error } = await supabase.from('terminal_data').select('*').like('key', 'visit_%').order('created_at', { ascending: false }).limit(10);
      if (error) throw error;
      if (!data || data.length === 0) return printLine('(暂无访问记录)', 'info');
      data.forEach(r => {
        try {
          const info = JSON.parse(r.value);
          printLine(`[${info.time}] ${info.ua}`, 'info');
        } catch {
          printLine(r.value, 'info');
        }
      });
    } catch (e) {
      printLine('读取失败: ' + e.message, 'error');
    }
  }
};

// ===== 输入处理 =====
input.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const raw = input.value.trim();
    if (!raw) return;
    printLine(`user@site:~$ ${raw}`);
    const [cmd, ...args] = raw.split(' ');
    if (commands[cmd]) await commands[cmd](args);
    else printLine(`未知命令: ${cmd} (输入 help)`, 'error');
    input.value = '';
  }
});

document.getElementById('terminal').addEventListener('click', () => input.focus());
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>不是哥们你还真进啊</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1d1f27, #3a3f58);
            font-family: "Microsoft YaHei", sans-serif;
            color: #fff;
            text-align: center;
        }
        .box {
            padding: 40px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        p {
            font-size: 20px;
            opacity: 0.8;
        }
        button {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: #ff5c5c;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #ff2e2e;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>不是哥们，你还真进啊？！</h1>
        <p>本来就是一句嘴嗨，你居然点进来了……</p>
        <button onclick="alert('叫你不要乱点连接，傻逼')">我不仅进了，我还要点一下</button>
    </div>
</body>
</html>

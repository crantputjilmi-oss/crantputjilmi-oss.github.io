<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Storage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin: 0; background: #1a1a1a; color: #0f0; font-family: monospace; height: 100vh; overflow: hidden; }
  #terminal { padding: 20px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
  #output { flex: 1; overflow-y: auto; margin-bottom: 10px; line-height: 1.5; }
  .input-line { display: flex; align-items: center; }
  #input { background: transparent; border: none; color: #0f0; font-family: monospace; font-size: 16px; flex: 1; outline: none; }
  .prompt { color: #0f0; margin-right: 10px; }
  .success { color: #0f0; } .error { color: #f00; } .info { color: #0af; } .warn { color: #fa0; }
</style>
</head>
<body>
<div id="terminal">
  <div id="output"></div>
  <div class="input-line">
    <span class="prompt">user@site:~$</span>
    <input type="text" id="input" autocomplete="off" autofocus>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://uckpwvrxopgqwycjvdgc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dTnGa3HTbJK8ySV70Ij13A_nDWTlBdp';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const output = document.getElementById('output');
const input = document.getElementById('input');
let history = [], historyIndex = 0;

function printLine(text, cls='') {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

async function logVisit() {
  try {
    await supabase.from('terminal_data').insert({ key: 'visit_'+Date.now(), value: JSON.stringify({ time: new Date().toISOString(), ua: navigator.userAgent }) });
  } catch(e) {}
}

const commands = {
  help: () => { printLine('save <k> <v> | get <k> | ls | del <k> | visits | clear | help | date'); },
  date: () => { printLine(new Date().toString()); },
  clear: () => { output.innerHTML = ''; },
  async save(args) {
    if(args.length<2) return printLine('用法: save <key> <value>', 'error');
    const [k, ...v] = args; const val = v.join(' ');
    try {
      await supabase.from('terminal_data').upsert({ key: k, value: val, created_at: new Date().toISOString() }, { onConflict: 'key' });
      printLine(`✓ 已保存: ${k} = ${val}`, 'success');
    } catch(e) { printLine('保存失败: '+e.message, 'error'); }
  },
  async get(args) {
    if(args.length<1) return printLine('用法: get <key>', 'error');
    try {
      const { data, error } = await supabase.from('terminal_data').select('*').eq('key', args[0]).order('created_at', {ascending:false}).limit(1).maybeSingle();
      if(error) throw error;
      if(!data) return printLine(`未找到 "${args[0]}"`, 'warn');
      printLine(`"${args[0]}" = "${data.value}"`, 'success');
    } catch(e) { printLine('读取失败: '+e.message, 'error'); }
  },
  async ls() {
    try {
      const { data, error } = await supabase.from('terminal_data').select('key, value, created_at').not('key','like','visit_%').order('created_at',{ascending:false}).limit(20);
      if(error) throw error;
      if(!data||!data.length) return printLine('(空)', 'info');
      data.forEach(r => printLine(`${r.key} = ${r.value}`, 'success'));
    } catch(e) { printLine('列表失败: '+e.message, 'error'); }
  },
  async del(args) {
    if(args.length<1) return printLine('用法: del <key>', 'error');
    try {
      await supabase.from('terminal_data').delete().eq('key', args[0]);
      printLine(`✓ 已删除 "${args[0]}"`, 'success');
    } catch(e) { printLine('删除失败: '+e.message, 'error'); }
  },
  async visits() {
    try {
      const { data, error } = await supabase.from('terminal_data').select('*').like('key','visit_%').order('created_at',{ascending:false}).limit(10);
      if(error) throw error;
      if(!data||!data.length) return printLine('(无访问)', 'info');
      data.forEach(r => { try { const i=JSON.parse(r.value); printLine(`[${i.time}] ${i.ua}`, 'info'); } catch { printLine(r.value, 'info'); } });
    } catch(e) { printLine('访问失败: '+e.message, 'error'); }
  }
};

input.onkeydown = async (e) => {
  if(e.key==='Enter') {
    const raw = input.value.trim();
    if(!raw) return;
    printLine(`user@site:~$ ${raw}`);
    history.push(raw); historyIndex = history.length;
    const [cmd, ...args] = raw.split(' ');
    if(commands[cmd]) await commands[cmd](args); else printLine(`未知命令: ${cmd} (输入 help)`, 'error');
    input.value = '';
  }
  if(e.key==='ArrowUp') { e.preventDefault(); if(historyIndex>0) { historyIndex--; input.value=history[historyIndex]; } }
  if(e.key==='ArrowDown') { e.preventDefault(); if(historyIndex<history.length-1) { historyIndex++; input.value=history[historyIndex]; } else { historyIndex=history.length; input.value=''; } }
};
document.getElementById('terminal').onclick = () => input.focus();
window.onload = () => { printLine('终端已就绪，输入 help 查看命令', 'info'); logVisit(); };
</script>
</body>
</html>

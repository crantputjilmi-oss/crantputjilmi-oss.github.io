<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
      font-size: 40px;
      color: white;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 24px;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0 auto 24px;
      border-radius: 2px;
    }

    .bio {
      font-size: 15px;
      color: #555;
      line-height: 1.8;
      margin-bottom: 28px;
      text-align: left;
    }

    .bio p {
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .tag {
      background: linear-gradient(135deg, #667eea22, #764ba222);
      color: #555;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }

    .links {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102,126,234,0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #555;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #bbb;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }
      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👤</div>
    <h1>你的名字</h1>
    <div class="subtitle">一句话介绍你自己</div>
    <div class="divider"></div>

    <div class="bio">
      <p>👋 你好！我是 <strong>你的名字</strong>。</p>
      <p>🎓 目前在做 / 学习：<strong>填你的方向</strong></p>
      <p>💡 喜欢的事情：<strong>填你的爱好</strong></p>
      <p>📍 所在地：<strong>填你的城市</strong></p>
    </div>

    <div class="tags">
      <span class="tag">标签1</span>
      <span class="tag">标签2</span>
      <span class="tag">标签3</span>
      <span class="tag">标签4</span>
    </div>

    <div class="links">
      <a class="btn btn-primary" href="#" target="_blank">联系我</a>
      <a class="btn btn-secondary" href="#" target="_blank">我的项目</a>
    </div>

    <footer>
      © 2026 你的名字 · Built with GitHub Pages
    </footer>
  </div>
</body>
</html>

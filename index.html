<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>刪川科技</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.8s;
        }

        body.day-mode { background: #e8eef5; }

        body::before {
            content: '';
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 200px 80px, #ccc, rgba(0,0,0,0));
            background-repeat: repeat; background-size: 250px 250px;
            animation: stars 4s linear infinite; opacity: 0.3; z-index: 0; transition: opacity 0.5s;
        }

        body.stars-off::before { opacity: 0; animation: none; }
        body.day-mode::before { opacity: 0; }

        @keyframes stars { from { transform: translateY(0); } to { transform: translateY(-250px); } }

        #seasonContainer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; overflow: hidden;
        }

        .season-particle { position: absolute; pointer-events: none; animation: fall linear infinite; }

        @keyframes fall {
            from { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            to { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
        }

        .click-ripple {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 9999;
            animation: rippleOut 0.7s ease-out forwards;
        }
        @keyframes rippleOut { from { transform: scale(0); opacity: 0.6; } to { transform: scale(4); opacity: 0; } }

        .click-particle { position: fixed; pointer-events: none; z-index: 9999; animation: particleBurst 0.8s ease-out forwards; }
        @keyframes particleBurst { from { opacity: 1; transform: scale(1) translate(0,0); } to { opacity: 0; transform: scale(0.3) translate(var(--tx), var(--ty)); } }

        .click-heart { position: fixed; pointer-events: none; z-index: 9999; animation: heartFloat 1s ease-out forwards; }
        @keyframes heartFloat { from { opacity: 1; transform: scale(1) translateY(0); } to { opacity: 0; transform: scale(1.5) translateY(-80px); } }

        .click-firework { position: fixed; pointer-events: none; z-index: 9999; border-radius: 50%; animation: fireworkBurst 0.9s ease-out forwards; }
        @keyframes fireworkBurst { from { opacity: 1; transform: scale(0); } to { opacity: 0; transform: scale(1); } }

        .touch-dot {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 9997;
            animation: touchDotFade 0.7s ease-out forwards;
        }
        @keyframes touchDotFade {
            0% { opacity: 0.85; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.2); }
        }

        .touch-fluid {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 9996;
            animation: fluidFade 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            filter: blur(2px);
        }
        @keyframes fluidFade {
            0% { opacity: 0.55; transform: scale(0.3) rotate(0deg); }
            50% { opacity: 0.25; }
            100% { opacity: 0; transform: scale(2.2) rotate(180deg); }
        }

        .touch-comet {
            position: fixed; pointer-events: none; z-index: 9995; border-radius: 50%;
            animation: cometFade 0.9s ease-out forwards;
        }
        @keyframes cometFade {
            0% { opacity: 0.9; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.1) translateX(var(--comet-dx)) translateY(var(--comet-dy)); }
        }

        .touch-neon {
            position: fixed; pointer-events: none; z-index: 9994; border-radius: 2px;
            animation: neonFade 0.6s ease-out forwards;
        }
        @keyframes neonFade {
            0% { opacity: 1; transform: scaleX(1) scaleY(1); }
            100% { opacity: 0; transform: scaleX(0.01) scaleY(3); }
        }

        .touch-ink {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 9993;
            animation: inkSpread 1.2s ease-out forwards;
            filter: blur(2px);
        }
        @keyframes inkSpread {
            0% { opacity: 0.45; transform: scale(0.2); }
            30% { opacity: 0.3; }
            100% { opacity: 0; transform: scale(2.8); }
        }

        .touch-silk-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9992;
        }

        .slide-in-right { animation: slideInRight 0.4s ease forwards; }
        .slide-in-left { animation: slideInLeft 0.4s ease forwards; }
        .slide-out-left { animation: slideOutLeft 0.4s ease forwards; }
        .slide-out-right { animation: slideOutRight 0.4s ease forwards; }

        @keyframes slideInRight { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideOutLeft { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-60px); } }
        @keyframes slideOutRight { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(60px); } }

        body.bg-solid { background: #0a0a1a; }
        body.bg-gradient { background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0a1a2e); }
        body.bg-purple { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
        body.bg-aurora { background: linear-gradient(180deg, #001a0a, #0a1a2e, #1a0a2e); }
        body.bg-aurora::after {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 50% 80%, rgba(0,255,128,0.08), transparent 60%),
                        radial-gradient(ellipse at 20% 60%, rgba(0,200,255,0.06), transparent 50%);
            z-index: 0; pointer-events: none;
        }
